<!doctype html>
<html lang="ko">
<head>
  <base href="../" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="description" content="필새 영상 아카이브 관리자 로그인" />
  <title>관리자 로그인 | 필새 영상 아카이브</title>
  <link id="dynamicFavicon" rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css?v=26.7.1-video-title-font" />
</head>
<body class="admin-page admin-locked" data-build="27.1-auto-sync-single-pass">
  <header class="site-header admin-site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="필새 영상 아카이브 홈">
        <span class="brand-main">필새 영상 아카이브</span>
        <span class="brand-handle">ADMIN</span>
      </a>
      <a class="channel-link" href="./">일반 아카이브 보기</a>
    </div>
  </header>

  <main id="adminSecureMount" class="container admin-page-container">
    <section class="admin-panel admin-login-gate">
      <div class="admin-heading">
        <div>
          <p class="eyebrow">ARCHIVE ADMIN</p>
          <h2>관리자 로그인</h2>
        </div>
      </div>

      <div class="admin-card admin-auth-card">
        <div class="admin-auth-lock-icon" aria-hidden="true">⌁</div>
        <h3>관리자 인증</h3>
        <p class="admin-help">
          로그인 전에는 관리자 화면과 관리자용 스크립트를 불러오지 않습니다.
        </p>
        <div class="admin-row admin-login-row">
          <input id="adminTokenInput" type="password" autocomplete="current-password"
            placeholder="ADMIN_TOKEN 입력" />
          <button id="saveAdminToken" type="button">관리자 로그인</button>
        </div>
        <div id="adminApiStatus" class="admin-status" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script>
  (() => {
    const TOKEN_KEY = "pilsaeAdminToken";
    const BUILD = "27.1-auto-sync-single-pass";
    const mount = document.getElementById("adminSecureMount");
    const input = document.getElementById("adminTokenInput");
    const button = document.getElementById("saveAdminToken");
    const status = document.getElementById("adminApiStatus");

    function setStatus(message, type="") {
      status.className = `admin-status ${type}`.trim();
      status.textContent = message || "";
    }

    async function getConfig() {
      const res = await fetch("./site-config.json", { cache:"no-store" });
      if (!res.ok) throw new Error("사이트 설정을 불러오지 못했습니다.");
      return res.json();
    }

    async function authorizeAndMount(token, { silent=false }={}) {
      if (!token) return false;
      button.disabled = true;
      if (!silent) setStatus("관리자 인증을 확인하는 중입니다…", "loading");

      try {
        const config = await getConfig();
        const base = String(config.adminApiUrl || "").replace(/\/$/, "");
        if (!base) throw new Error("관리자 API 주소가 설정되지 않았습니다.");

        const headers = { "Authorization": `Bearer ${token}` };

        const auth = await fetch(`${base}/admin-auth`, {
          method:"GET",
          headers,
          cache:"no-store"
        });
        if (!auth.ok) throw new Error("관리자 인증에 실패했습니다.");

        // Only after successful authentication do we request the real admin DOM.
        const shell = await fetch(`${base}/admin-ui-shell`, {
          method:"GET",
          headers,
          cache:"no-store"
        });
        if (!shell.ok) throw new Error("관리자 화면을 불러오지 못했습니다.");

        const html = await shell.text();
        sessionStorage.setItem(TOKEN_KEY, token);
        mount.innerHTML = html;

        // Main application code is also not loaded until authentication succeeds.
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = `./script.js?v=${BUILD}`;
          script.async = false;
          script.onload = resolve;
          script.onerror = () => reject(new Error("관리자 스크립트를 불러오지 못했습니다."));
          document.body.appendChild(script);
        });

        return true;
      } catch (err) {
        sessionStorage.removeItem(TOKEN_KEY);
        input.value = "";
        setStatus(err?.message || "관리자 로그인 중 오류가 발생했습니다.", "error");
        return false;
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", () => {
      const token = input.value.trim();
      if (!token) {
        setStatus("ADMIN_TOKEN을 입력해 주세요.", "error");
        return;
      }
      authorizeAndMount(token);
    });

    input.addEventListener("keydown", event => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      button.click();
    });

    const saved = sessionStorage.getItem(TOKEN_KEY) || "";
    if (saved) {
      input.value = saved;
      authorizeAndMount(saved, { silent:true });
    }
  })();
  </script>
</body>
</html>
