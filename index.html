<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="필새 영상 아카이브 - 날짜로 다시 찾는 영상 기록" />
  <title>필새 영상 아카이브</title>
  <link id="dynamicFavicon" rel="icon" href="data:," />
  <link rel="stylesheet" href="./style.css?v=19.4" />
</head>
<body class="site-config-pending" data-build="19.4">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="필새 영상 아카이브 홈">
        <span class="brand-main">필새 영상 아카이브</span>
        <span class="brand-handle">@pilsae</span>
      </a>
      <a class="channel-link" href="https://www.youtube.com/@pilsae" target="_blank" rel="noopener noreferrer">채널 보기</a>
    </div>
  </header>

  <main class="container">
    <section class="hero hero-branded public-archive-ui" id="channelHero">
      <div class="hero-banner-wrap" aria-hidden="true">
        <div class="hero-banner-image" id="heroBannerImage"></div>
        <div class="hero-banner-overlay"></div>
      </div>
      <div class="hero-profile-row">
        <div class="hero-avatar" id="heroAvatar"><span class="hero-avatar-fallback">P</span></div>
        <div class="hero-copy">
          <p class="eyebrow">SHIN HYE SUNG VIDEO ARCHIVE</p>
          <p class="hero-handle" id="heroHandle">@pilsae</p>
          <h1 id="mainTitle">날짜로 다시 찾는 영상 기록</h1>
          <p class="hero-description">영상 설명에 기록된 원본 날짜와 출처를 기준으로 정리했습니다.</p>
          <div class="hero-stats hero-stats-public" aria-label="아카이브 요약">
            <span><b id="heroTotal">—</b>개의 영상 기록</span>
          </div>
        </div>
      </div>
    </section>

    <section class="toolbar-panel public-archive-ui" aria-label="영상 검색 및 필터">
      <div class="toolbar-primary">
        <div class="stat-card">
          <span class="stat-label">전체 영상</span>
          <strong id="videoCount">—개</strong>
        </div>

        <label class="field search-field">
          <span>영상 검색</span>
          <div class="search-control">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="제목 · 출처 · 날짜 검색" autocomplete="off"
              aria-autocomplete="list" aria-controls="searchSuggestions" aria-expanded="false" />
            <button id="clearSearchBtn" class="clear-search-btn" type="button" aria-label="검색어 지우기" hidden>×</button>
          </div>
          <div id="searchSuggestions" class="search-suggestions" role="listbox" hidden></div>
        </label>

        <button id="mobileFilterToggle" class="mobile-filter-toggle" type="button" aria-expanded="false" aria-controls="filterExtra">
          <span>필터</span>
          <span class="filter-count" id="activeFilterCount" hidden>0</span>
          <span class="filter-chevron" aria-hidden="true">⌄</span>
        </button>
      </div>

      <div id="filterExtra" class="filter-extra">
        <label class="field">
          <span>연도 선택</span>
          <select id="yearFilter">
            <option value="">전체 연도</option>
          </select>
        </label>

        <label class="field">
          <span>날짜 유형</span>
          <select id="typeFilter">
            <option value="">전체 날짜 유형</option>
            <option value="single">단일 연도</option>
            <option value="mixed">혼합 연도</option>
            <option value="unknown">날짜 미확인</option>
          </select>
        </label>

        <label class="field">
          <span>콘텐츠 유형</span>
          <select id="contentTypeFilter">
            <option value="">전체 콘텐츠</option>
            <option value="video">일반 영상</option>
            <option value="playlist">플레이리스트</option>
          </select>
        </label>

        <label class="field">
          <span>정렬</span>
          <select id="sortFilter">
            <option value="source-desc">원본 날짜 최신순</option>
            <option value="source-asc">원본 날짜 오래된순</option>
            <option value="upload-desc">업로드 최신순</option>
            <option value="upload-asc">업로드 오래된순</option>
            <option value="title-asc">제목 가나다순</option>
          </select>
        </label>

        <button id="resetFilters" class="reset-filter-button" type="button">필터 초기화</button>
      </div>
    </section>

    <div id="activeFilterChips" class="active-filter-chips public-archive-ui" aria-live="polite"></div>

    <nav id="yearJumpBar" class="year-jump-bar public-archive-ui" aria-label="연도 빠른 이동" hidden></nav>

    <div class="result-header public-archive-ui">
      <section id="resultMeta" class="result-meta" aria-live="polite"></section>
      <div class="view-toggle" role="group" aria-label="보기 방식">
        <button id="gridViewBtn" class="view-toggle-btn active" type="button" aria-label="카드형 보기" title="카드형 보기">
          <span class="view-icon" aria-hidden="true">▦</span><span class="view-label">카드</span>
        </button>
        <button id="listViewBtn" class="view-toggle-btn" type="button" aria-label="목록형 보기" title="목록형 보기">
          <span class="view-icon" aria-hidden="true">☰</span><span class="view-label">목록</span>
        </button>
        <button id="timelineViewBtn" class="view-toggle-btn" type="button" aria-label="연도·월 아카이브 보기" title="연도·월 아카이브 보기">
          <span class="view-icon" aria-hidden="true">≡</span><span class="view-label">연도·월</span>
        </button>
      </div>
    </div>
    <section id="loadingState" class="loading-state public-archive-ui" aria-live="polite">
      <div class="loading-message"><span class="loading-dot" aria-hidden="true"></span>영상 목록을 불러오는 중입니다.</div>
      <div class="skeleton-grid" aria-hidden="true">
        <article class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-body"><span></span><span></span><span></span></div></article>
        <article class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-body"><span></span><span></span><span></span></div></article>
        <article class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-body"><span></span><span></span><span></span></div></article>
        <article class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-body"><span></span><span></span><span></span></div></article>
        <article class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-body"><span></span><span></span><span></span></div></article>
        <article class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-body"><span></span><span></span><span></span></div></article>
      </div>
    </section>

    <section id="videoGrid" class="video-grid public-archive-ui" aria-live="polite"></section>

    <div class="load-more-wrap public-archive-ui">
      <button id="loadMoreBtn" class="load-more-button" type="button" hidden>더 보기</button>
    </div>

    <section id="emptyState" class="empty-state public-archive-ui" hidden>
      <strong>조건에 맞는 영상이 없습니다.</strong>
      <p id="emptyStateDetail">검색어나 필터를 변경해 보세요.</p>
      <button id="emptyResetBtn" class="empty-reset-btn" type="button">검색·필터 초기화</button>
    </section>

    <button id="backToTopBtn" class="back-to-top public-archive-ui" type="button" aria-label="맨 위로 이동" hidden>↑</button>


  </main>

  <footer class="footer">
    <span>필새 영상 아카이브</span>
  </footer>

  <script src="./script.js?v=19.4" defer></script>
</body>
</html>
